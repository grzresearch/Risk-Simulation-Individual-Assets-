<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <style>
      .bg { fill:#0e1015; }
      .title { fill:#e6e9ef; font-size:18px; font-weight:700; }
      .sub { fill:#8590a6; font-size:12px; }
      .axislabel { fill:#8590a6; font-size:10px; }
      .ann { fill:#e6e9ef; font-size:11px; }
      .label { fill:#e6e9ef; font-size:11px; }
      .kpi-label { fill:#8590a6; font-size:11px; }
      .kpi-value { fill:#e6e9ef; font-size:22px; font-weight:700; }
    </style>
  </defs>
  <rect width="960" height="480" class="bg"/>
  <text x="20" y="32" class="title">Portfolio risk &#8212; component-VaR &amp; correlation</text>
  <text x="20" y="52" class="sub">1-day VaR/CVaR via empirical Cholesky Monte-Carlo; component-VaR by finite-difference</text>

  <!-- KPI strip -->
  <g transform="translate(20,80)">
    <rect x="0"   y="0" width="180" height="80" rx="8" fill="#1a1f2c" stroke="#2a2f3a"/>
    <text x="14"  y="22" class="kpi-label">Portfolio VaR 95</text>
    <text x="14"  y="58" class="kpi-value" fill="#ff7a8a">1.42%</text>

    <rect x="200" y="0" width="180" height="80" rx="8" fill="#1a1f2c" stroke="#2a2f3a"/>
    <text x="214" y="22" class="kpi-label">Portfolio VaR 99</text>
    <text x="214" y="58" class="kpi-value" fill="#ff7a8a">2.18%</text>

    <rect x="400" y="0" width="180" height="80" rx="8" fill="#1a1f2c" stroke="#2a2f3a"/>
    <text x="414" y="22" class="kpi-label">Expected Shortfall 95</text>
    <text x="414" y="58" class="kpi-value" fill="#ff7a8a">1.93%</text>

    <rect x="600" y="0" width="180" height="80" rx="8" fill="#1a1f2c" stroke="#2a2f3a"/>
    <text x="614" y="22" class="kpi-label">Expected Shortfall 99</text>
    <text x="614" y="58" class="kpi-value" fill="#ff7a8a">2.86%</text>

    <rect x="800" y="0" width="140" height="80" rx="8" fill="#1a1f2c" stroke="#2a2f3a"/>
    <text x="814" y="22" class="kpi-label">N assets</text>
    <text x="814" y="58" class="kpi-value">6</text>
  </g>

  <!-- Component VaR bars (left) -->
  <text x="20" y="190" class="ann" font-weight="700">Component-VaR contribution</text>
  <g transform="translate(20,210)">
    <!-- 6 holdings: spy 0.5, tlt 0.2, gld 0.1, btc 0.05, eth 0.05, uso 0.1 -->
    <!-- comp-VaR proportional to weight x marginal; spy dominates -->
    <text x="0"  y="22" class="label">SPY (50%)</text>
    <rect x="100" y="10" width="0"   height="14" fill="#222836"/>
    <rect x="100" y="10" width="280" height="14" fill="#ff7a8a"/>
    <text x="388" y="22" class="ann">0.83%</text>

    <text x="0"  y="50" class="label">TLT (20%)</text>
    <rect x="100" y="38" width="120" height="14" fill="#ff7a8a"/>
    <text x="228" y="50" class="ann">0.21%</text>

    <text x="0"  y="78" class="label">USO (10%)</text>
    <rect x="100" y="66" width="95" height="14" fill="#ff7a8a"/>
    <text x="203" y="78" class="ann">0.18%</text>

    <text x="0"  y="106" class="label">GLD (10%)</text>
    <rect x="100" y="94" width="32" height="14" fill="#ff7a8a"/>
    <text x="140" y="106" class="ann">0.06%</text>

    <text x="0"  y="134" class="label">BTC (5%)</text>
    <rect x="100" y="122" width="40" height="14" fill="#ff7a8a"/>
    <text x="148" y="134" class="ann">0.08%</text>

    <text x="0"  y="162" class="label">ETH (5%)</text>
    <rect x="100" y="150" width="32" height="14" fill="#ff7a8a"/>
    <text x="140" y="162" class="ann">0.06%</text>
  </g>

  <!-- Correlation heatmap (right) -->
  <text x="540" y="190" class="ann" font-weight="700">Empirical correlation matrix (daily log returns)</text>
  <g transform="translate(540,200)">
    <!-- 6x6 grid, cell 50px -->
    <!-- labels -->
    <text x="0" y="40"  text-anchor="end" class="label">SPY</text>
    <text x="0" y="80"  text-anchor="end" class="label">TLT</text>
    <text x="0" y="120" text-anchor="end" class="label">USO</text>
    <text x="0" y="160" text-anchor="end" class="label">GLD</text>
    <text x="0" y="200" text-anchor="end" class="label">BTC</text>
    <text x="0" y="240" text-anchor="end" class="label">ETH</text>

    <text x="32"  y="262" text-anchor="middle" class="label">SPY</text>
    <text x="80"  y="262" text-anchor="middle" class="label">TLT</text>
    <text x="128" y="262" text-anchor="middle" class="label">USO</text>
    <text x="176" y="262" text-anchor="middle" class="label">GLD</text>
    <text x="224" y="262" text-anchor="middle" class="label">BTC</text>
    <text x="272" y="262" text-anchor="middle" class="label">ETH</text>

    <!-- Use color by correlation: -1 red, 0 dark, +1 green; here mostly 0..0.6 -->
    <!-- Row SPY -->
    <rect x="8"   y="20" width="48" height="40" fill="#5bd99a"/><text x="32"  y="44" text-anchor="middle" class="label">1.00</text>
    <rect x="56"  y="20" width="48" height="40" fill="#48334a"/><text x="80"  y="44" text-anchor="middle" class="label">-0.31</text>
    <rect x="104" y="20" width="48" height="40" fill="#345066"/><text x="128" y="44" text-anchor="middle" class="label">0.42</text>
    <rect x="152" y="20" width="48" height="40" fill="#243846"/><text x="176" y="44" text-anchor="middle" class="label">0.08</text>
    <rect x="200" y="20" width="48" height="40" fill="#2a4258"/><text x="224" y="44" text-anchor="middle" class="label">0.22</text>
    <rect x="248" y="20" width="48" height="40" fill="#2c4456"/><text x="272" y="44" text-anchor="middle" class="label">0.24</text>

    <!-- Row TLT -->
    <rect x="8"   y="60" width="48" height="40" fill="#48334a"/><text x="32"  y="84" text-anchor="middle" class="label">-0.31</text>
    <rect x="56"  y="60" width="48" height="40" fill="#5bd99a"/><text x="80"  y="84" text-anchor="middle" class="label">1.00</text>
    <rect x="104" y="60" width="48" height="40" fill="#3a2c3c"/><text x="128" y="84" text-anchor="middle" class="label">-0.18</text>
    <rect x="152" y="60" width="48" height="40" fill="#2c4858"/><text x="176" y="84" text-anchor="middle" class="label">0.27</text>
    <rect x="200" y="60" width="48" height="40" fill="#221a26"/><text x="224" y="84" text-anchor="middle" class="label">-0.05</text>
    <rect x="248" y="60" width="48" height="40" fill="#221a26"/><text x="272" y="84" text-anchor="middle" class="label">-0.04</text>

    <!-- Row USO -->
    <rect x="8"   y="100" width="48" height="40" fill="#345066"/><text x="32"  y="124" text-anchor="middle" class="label">0.42</text>
    <rect x="56"  y="100" width="48" height="40" fill="#3a2c3c"/><text x="80"  y="124" text-anchor="middle" class="label">-0.18</text>
    <rect x="104" y="100" width="48" height="40" fill="#5bd99a"/><text x="128" y="124" text-anchor="middle" class="label">1.00</text>
    <rect x="152" y="100" width="48" height="40" fill="#2a4258"/><text x="176" y="124" text-anchor="middle" class="label">0.18</text>
    <rect x="200" y="100" width="48" height="40" fill="#243846"/><text x="224" y="124" text-anchor="middle" class="label">0.10</text>
    <rect x="248" y="100" width="48" height="40" fill="#243846"/><text x="272" y="124" text-anchor="middle" class="label">0.12</text>

    <!-- Row GLD -->
    <rect x="8"   y="140" width="48" height="40" fill="#243846"/><text x="32"  y="164" text-anchor="middle" class="label">0.08</text>
    <rect x="56"  y="140" width="48" height="40" fill="#2c4858"/><text x="80"  y="164" text-anchor="middle" class="label">0.27</text>
    <rect x="104" y="140" width="48" height="40" fill="#2a4258"/><text x="128" y="164" text-anchor="middle" class="label">0.18</text>
    <rect x="152" y="140" width="48" height="40" fill="#5bd99a"/><text x="176" y="164" text-anchor="middle" class="label">1.00</text>
    <rect x="200" y="140" width="48" height="40" fill="#243846"/><text x="224" y="164" text-anchor="middle" class="label">0.09</text>
    <rect x="248" y="140" width="48" height="40" fill="#243846"/><text x="272" y="164" text-anchor="middle" class="label">0.07</text>

    <!-- Row BTC -->
    <rect x="8"   y="180" width="48" height="40" fill="#2a4258"/><text x="32"  y="204" text-anchor="middle" class="label">0.22</text>
    <rect x="56"  y="180" width="48" height="40" fill="#221a26"/><text x="80"  y="204" text-anchor="middle" class="label">-0.05</text>
    <rect x="104" y="180" width="48" height="40" fill="#243846"/><text x="128" y="204" text-anchor="middle" class="label">0.10</text>
    <rect x="152" y="180" width="48" height="40" fill="#243846"/><text x="176" y="204" text-anchor="middle" class="label">0.09</text>
    <rect x="200" y="180" width="48" height="40" fill="#5bd99a"/><text x="224" y="204" text-anchor="middle" class="label">1.00</text>
    <rect x="248" y="180" width="48" height="40" fill="#3a8a55"/><text x="272" y="204" text-anchor="middle" class="label">0.74</text>

    <!-- Row ETH -->
    <rect x="8"   y="220" width="48" height="40" fill="#2c4456"/><text x="32"  y="244" text-anchor="middle" class="label">0.24</text>
    <rect x="56"  y="220" width="48" height="40" fill="#221a26"/><text x="80"  y="244" text-anchor="middle" class="label">-0.04</text>
    <rect x="104" y="220" width="48" height="40" fill="#243846"/><text x="128" y="244" text-anchor="middle" class="label">0.12</text>
    <rect x="152" y="220" width="48" height="40" fill="#243846"/><text x="176" y="244" text-anchor="middle" class="label">0.07</text>
    <rect x="200" y="220" width="48" height="40" fill="#3a8a55"/><text x="224" y="244" text-anchor="middle" class="label">0.74</text>
    <rect x="248" y="220" width="48" height="40" fill="#5bd99a"/><text x="272" y="244" text-anchor="middle" class="label">1.00</text>
  </g>

  <text x="20" y="465" class="sub">SPY contributes ~58% of portfolio VaR despite being half the weight; BTC/ETH cluster (corr 0.74).</text>
</svg>
