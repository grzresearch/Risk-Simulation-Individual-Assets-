  <rect width="960" height="440" class="bg"/>
  <text x="20" y="32" class="title">GARCH(1,1) conditional volatility &#8212; SPY daily, last 4y</text>
  <text x="20" y="52" class="sub">realized abs returns (grey) vs fitted &#963;_t (blue) &#183; annualised: hist 14.3%, GARCH 18.7%</text>

  <!-- chart 60-940, y 80-360 -->
  <g>
    <line x1="60"  y1="360" x2="940" y2="360" class="axis"/>
    <line x1="60"  y1="80"  x2="60"  y2="360" class="axis"/>
