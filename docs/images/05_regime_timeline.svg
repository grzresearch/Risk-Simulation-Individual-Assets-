<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <style>
      .bg { fill:#0e1015; }
      .title { fill:#e6e9ef; font-size:18px; font-weight:700; }
      .sub { fill:#8590a6; font-size:12px; }
      .axislabel { fill:#8590a6; font-size:10px; }
      .ann { fill:#e6e9ef; font-size:11px; }
      .legend { fill:#9fb0c8; font-size:11px; }
    </style>
  </defs>
  <rect width="960" height="360" class="bg"/>
  <text x="20" y="32" class="title">Macro regime timeline &#8212; rule-based classifier</text>
  <text x="20" y="52" class="sub">priority: Risk-Off (VIX&gt;28 or DD&lt;-10%) &gt; Stagflation &gt; Hiking &gt; Easing &gt; Neutral</text>

  <!-- timeline 60-940, y 100-160 -->
  <g>
    <text x="60"  y="92"  class="axislabel">2017</text>
    <text x="170" y="92"  class="axislabel">2018</text>
    <text x="280" y="92"  class="axislabel">2019</text>
    <text x="390" y="92"  class="axislabel">2020</text>
    <text x="500" y="92"  class="axislabel">2021</text>
    <text x="610" y="92"  class="axislabel">2022</text>
    <text x="720" y="92"  class="axislabel">2023</text>
    <text x="830" y="92"  class="axislabel">2024</text>
    <text x="940" y="92"  class="axislabel">2025</text>

    <!-- segments -->
    <rect x="60"  y="100" width="58"  height="60" fill="#5bd99a"/>     <!-- 17 Easing -->
    <rect x="118" y="100" width="60"  height="60" fill="#6aa3ff"/>     <!-- early 18 Neutral -->
    <rect x="178" y="100" width="55"  height="60" fill="#ff7a8a"/>     <!-- Q4 18 Risk-Off -->
    <rect x="233" y="100" width="100" height="60" fill="#6aa3ff"/>     <!-- 19 Neutral -->
    <rect x="333" y="100" width="35"  height="60" fill="#ff7a8a"/>     <!-- Mar 20 Risk-Off -->
    <rect x="368" y="100" width="142" height="60" fill="#5bd99a"/>     <!-- 20-21 Easing -->
    <rect x="510" y="100" width="65"  height="60" fill="#6aa3ff"/>     <!-- early 22 Neutral -->
    <rect x="575" y="100" width="115" height="60" fill="#f5a26d"/>     <!-- mid 22 Hiking -->
    <rect x="690" y="100" width="40"  height="60" fill="#c97777"/>     <!-- Stagflation -->
    <rect x="730" y="100" width="125" height="60" fill="#f5a26d"/>     <!-- Hiking -->
    <rect x="855" y="100" width="85"  height="60" fill="#6aa3ff"/>     <!-- Neutral -->

    <!-- axis line -->
    <line x1="60" y1="160" x2="940" y2="160" stroke="#3a4150"/>

    <!-- annotations -->
    <line x1="350" y1="100" x2="350" y2="80" stroke="#ff7a8a" stroke-width="1"/>
    <text x="350" y="76" text-anchor="middle" class="ann">Covid</text>
    <line x1="200" y1="100" x2="200" y2="80" stroke="#ff7a8a" stroke-width="1"/>
    <text x="200" y="76" text-anchor="middle" class="ann">Q4 2018</text>
    <line x1="640" y1="160" x2="640" y2="180" stroke="#f5a26d" stroke-width="1"/>
    <text x="640" y="194" text-anchor="middle" class="ann">CPI shock + 75bp hikes</text>
  </g>

  <!-- legend -->
  <g transform="translate(60,230)">
    <rect x="0"   y="0" width="14" height="14" fill="#5bd99a"/>
    <text x="20"  y="11" class="legend">Easing &#8212; FFR &lt; 1% or CPI &lt; 2%</text>

    <rect x="220" y="0" width="14" height="14" fill="#6aa3ff"/>
    <text x="240" y="11" class="legend">Neutral</text>

    <rect x="340" y="0" width="14" height="14" fill="#f5a26d"/>
    <text x="360" y="11" class="legend">Hiking &#8212; CPI &gt; 3%, FFR &gt; 2.5%</text>

    <rect x="580" y="0" width="14" height="14" fill="#c97777"/>
    <text x="600" y="11" class="legend">Stagflation &#8212; CPI &gt; 5%, U &gt; 5%</text>

    <rect x="0"   y="28" width="14" height="14" fill="#ff7a8a"/>
    <text x="20"  y="39" class="legend">Risk-Off &#8212; VIX &gt; 28 or SPY 3M-DD &lt; -10%</text>
  </g>

  <text x="20" y="320" class="sub">For every (asset, event) the engine carves out the historical sub-sample that matches the</text>
  <text x="20" y="338" class="sub">current regime &#8212; the regime-conditional posterior P(up) is computed on this sub-sample only.</text>
</svg>
