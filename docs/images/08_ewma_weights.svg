<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <style>
      .bg { fill:#0e1015; }
      .title { fill:#e6e9ef; font-size:18px; font-weight:700; }
      .sub { fill:#8590a6; font-size:12px; }
      .axislabel { fill:#8590a6; font-size:10px; }
      .ann { fill:#e6e9ef; font-size:11px; }
    </style>
  </defs>
  <rect width="960" height="360" class="bg"/>
  <text x="20" y="32" class="title">EWMA time-decay weights &#8212; recent samples count more</text>
  <text x="20" y="52" class="sub">weight w_i = exp(-ln(2) &#183; age_i / half_life)  &#183;  half_life = 24 samples (=2y monthly cadence)</text>

  <!-- chart 60-940, y 80-280 -->
  <g>
    <line x1="60"  y1="280" x2="940" y2="280" stroke="#3a4150"/>
    <line x1="60"  y1="80"  x2="60"  y2="280" stroke="#3a4150"/>

    <!-- 60 bars -->
    <!-- bar width 13, gap 1.5 -->
    <g>
      <!-- Generate decreasing-toward-left bars where rightmost is tallest -->
