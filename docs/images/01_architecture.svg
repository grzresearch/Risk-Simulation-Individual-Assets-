<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <style>
      .bg { fill:#0e1015; } .panel { fill:#1a1f2c; stroke:#2a2f3a; stroke-width:1; }
      .label { fill:#e6e9ef; font-size:13px; font-weight:600; }
      .small { fill:#8590a6; font-size:11px; }
      .arrow { stroke:#5b6478; stroke-width:1.5; fill:none; }
      .src { fill:#1f3140; stroke:#3aa3d8; stroke-width:1.2; }
      .eng { fill:#1f2a40; stroke:#6aa3ff; stroke-width:1.2; }
      .out { fill:#1f3a2a; stroke:#5bd99a; stroke-width:1.2; }
      .gov { fill:#3a2a1f; stroke:#f0c674; stroke-width:1.2; }
      .title { fill:#e6e9ef; font-size:18px; font-weight:700; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6478"/>
    </marker>
  </defs>

  <rect width="960" height="520" class="bg"/>
  <text x="20" y="32" class="title">macro_risk &#8212; component architecture</text>
  <text x="20" y="52" class="small">data sources &#8594; engine modules &#8594; outputs &amp; governance</text>

  <!-- DATA SOURCES -->
  <text x="40" y="90" class="label" fill="#3aa3d8">DATA SOURCES</text>
  <g>
    <rect x="40" y="100" width="160" height="44" rx="6" class="src"/>
    <text x="120" y="120" text-anchor="middle" class="label">FRED</text>
    <text x="120" y="135" text-anchor="middle" class="small">CPI / PPI / FOMC / NFP</text>

    <rect x="40" y="160" width="160" height="44" rx="6" class="src"/>
    <text x="120" y="180" text-anchor="middle" class="label">Yahoo Finance</text>
    <text x="120" y="195" text-anchor="middle" class="small">equities, ETFs, FX</text>

    <rect x="40" y="220" width="160" height="44" rx="6" class="src"/>
    <text x="120" y="240" text-anchor="middle" class="label">CoinGecko</text>
    <text x="120" y="255" text-anchor="middle" class="small">crypto daily prices</text>

    <rect x="40" y="280" width="160" height="44" rx="6" class="src"/>
    <text x="120" y="300" text-anchor="middle" class="label">Consensus CSV</text>
    <text x="120" y="315" text-anchor="middle" class="small">surprise standardisation</text>
  </g>

  <!-- ENGINE -->
  <text x="240" y="90" class="label" fill="#6aa3ff">ENGINE</text>
  <rect x="240" y="100" width="320" height="320" rx="8" fill="#10141d" stroke="#2a2f3a"/>

  <g>
    <rect x="252" y="116" width="140" height="34" rx="4" class="eng"/>
    <text x="322" y="138" text-anchor="middle" class="label">historical_analyzer</text>

    <rect x="252" y="156" width="140" height="34" rx="4" class="eng"/>
    <text x="322" y="178" text-anchor="middle" class="label">surprise (z)</text>

    <rect x="252" y="196" width="140" height="34" rx="4" class="eng"/>
    <text x="322" y="218" text-anchor="middle" class="label">regime classifier</text>

    <rect x="252" y="236" width="140" height="34" rx="4" class="eng"/>
    <text x="322" y="258" text-anchor="middle" class="label">GARCH(1,1)</text>

    <rect x="252" y="276" width="140" height="34" rx="4" class="eng"/>
    <text x="322" y="298" text-anchor="middle" class="label">multi-test FDR</text>

    <rect x="252" y="316" width="140" height="34" rx="4" class="eng"/>
    <text x="322" y="338" text-anchor="middle" class="label">backtest WF</text>

    <rect x="252" y="356" width="140" height="34" rx="4" class="eng"/>
    <text x="322" y="378" text-anchor="middle" class="label">stress replay</text>

    <rect x="408" y="116" width="140" height="34" rx="4" class="eng"/>
    <text x="478" y="138" text-anchor="middle" class="label">posterior P(up)</text>

    <rect x="408" y="156" width="140" height="34" rx="4" class="eng"/>
    <text x="478" y="178" text-anchor="middle" class="label">EWMA decay</text>

    <rect x="408" y="196" width="140" height="34" rx="4" class="eng"/>
    <text x="478" y="218" text-anchor="middle" class="label">Monte-Carlo (OMP)</text>

    <rect x="408" y="236" width="140" height="34" rx="4" class="eng"/>
    <text x="478" y="258" text-anchor="middle" class="label">VaR / ES</text>

    <rect x="408" y="276" width="140" height="34" rx="4" class="eng"/>
    <text x="478" y="298" text-anchor="middle" class="label">portfolio Cholesky</text>

    <rect x="408" y="316" width="140" height="34" rx="4" class="eng"/>
    <text x="478" y="338" text-anchor="middle" class="label">component-VaR</text>

    <rect x="408" y="356" width="140" height="34" rx="4" class="eng"/>
    <text x="478" y="378" text-anchor="middle" class="label">calibration / Brier</text>
  </g>

  <!-- OUTPUTS -->
  <text x="600" y="90" class="label" fill="#5bd99a">OUTPUTS</text>
  <g>
    <rect x="600" y="100" width="160" height="34" rx="4" class="out"/>
    <text x="680" y="122" text-anchor="middle" class="label">CLI text + JSON</text>

    <rect x="600" y="146" width="160" height="34" rx="4" class="out"/>
    <text x="680" y="168" text-anchor="middle" class="label">CSV / HTML report</text>

    <rect x="600" y="192" width="160" height="34" rx="4" class="out"/>
    <text x="680" y="214" text-anchor="middle" class="label">REST + Prometheus</text>

    <rect x="600" y="238" width="160" height="34" rx="4" class="out"/>
    <text x="680" y="260" text-anchor="middle" class="label">Postgres / JSON store</text>

    <rect x="600" y="284" width="160" height="34" rx="4" class="out"/>
    <text x="680" y="306" text-anchor="middle" class="label">Slack alerter</text>
  </g>

  <!-- GOVERNANCE -->
  <text x="780" y="90" class="label" fill="#f0c674">GOVERNANCE</text>
  <g>
    <rect x="780" y="100" width="160" height="34" rx="4" class="gov"/>
    <text x="860" y="122" text-anchor="middle" class="label">audit log</text>

    <rect x="780" y="146" width="160" height="34" rx="4" class="gov"/>
    <text x="860" y="168" text-anchor="middle" class="label">model card (SR 11-7)</text>

    <rect x="780" y="192" width="160" height="34" rx="4" class="gov"/>
    <text x="860" y="214" text-anchor="middle" class="label">RBAC roles</text>

    <rect x="780" y="238" width="160" height="34" rx="4" class="gov"/>
    <text x="860" y="260" text-anchor="middle" class="label">version + git SHA</text>
  </g>

  <!-- ARROWS -->
  <line x1="200" y1="122" x2="240" y2="160" class="arrow" marker-end="url(#arrow)"/>
  <line x1="200" y1="182" x2="240" y2="200" class="arrow" marker-end="url(#arrow)"/>
  <line x1="200" y1="242" x2="240" y2="240" class="arrow" marker-end="url(#arrow)"/>
  <line x1="200" y1="302" x2="240" y2="280" class="arrow" marker-end="url(#arrow)"/>
  <line x1="560" y1="200" x2="600" y2="170" class="arrow" marker-end="url(#arrow)"/>
  <line x1="560" y1="260" x2="600" y2="220" class="arrow" marker-end="url(#arrow)"/>
  <line x1="560" y1="320" x2="600" y2="280" class="arrow" marker-end="url(#arrow)"/>

  <text x="20" y="490" class="small">build: CMake + libcurl + nlohmann/json + cpp-httplib + (optional) OpenMP &amp; libpq</text>
  <text x="20" y="508" class="small">runtime: Docker, docker-compose with Postgres + Prometheus, GitHub Actions CI</text>
</svg>
